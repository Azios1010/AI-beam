[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-beam"
version = "0.1.0"
description = "Basic image-position tracking and bounding-box grid projection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
detector = ["ultralytics"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
